[package]
name = "rpic_isr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Periodic electrostatic electron-ion PIC and an ISR density-fluctuation spectrum"

[features]
default = []
cuda = ["dep:cudarc"]
plot = ["dep:rustplotlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_distr = "0.5"
rustfft = "6.4"
hdf5 = { package = "hdf5-metno", version = "0.15" }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cufft", "dynamic-loading", "cuda-12000"] }
rustplotlib = { git = "https://github.com/jvierine/rustplotlib", optional = true }

[[bin]]
name = "rpic_isr"
path = "src/main.rs"

[[bin]]
name = "plot_results"
path = "src/bin/plot_results.rs"
required-features = ["plot"]

[profile.release]
codegen-units = 1
lto = "thin"

