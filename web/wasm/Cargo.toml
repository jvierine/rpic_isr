[package]
name = "picisr_web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
rustfft = "6.4"
rustplotlib-web = { path = "../vendor/rustplotlib-web" }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d"] }

[profile.release]
opt-level = 3
lto = true

